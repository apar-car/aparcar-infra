type ParkingSignalResponse {
  success: Boolean!
  signalId: String
  expiresAt: Int
  earlyWarningAt: Int
  timerMinutes: Int
  error: String
}

type LookResponse {
  success: Boolean!
  lookId: String
  error: String
}

type ExchangeResponse {
  success: Boolean!
  exchangeId: String
  arrivalDeadline: Int
  error: String
}

type ConfirmResponse {
  success: Boolean!
  exchangeId: String
  error: String
}

type CancelResponse {
  success: Boolean!
  exchangeId: String
  error: String
}

type RatingResponse {
  success: Boolean!
  error: String
}

type ParkingSignal {
  signalId: String!
  user: String!
  carDetails: String!
  lat: Float!
  lng: Float!
  timerMinutes: Int!
  expiresAt: Int!
}

type Mutation {
  createParkingSignal(
    user: String!
    carDetails: String!
    lat: Float!
    lng: Float!
    timer_minutes: Int!
  ): ParkingSignalResponse!

  registerLookingDriver(
    userId: String!
    lat: Float!
    lng: Float!
    radius_meters: Int!
  ): LookResponse!

  requestSpot(
    signalId: String!
    userId: String!
  ): ExchangeResponse!

  confirmExchange(
    exchangeId: String!
    userId: String!
  ): ConfirmResponse!

  cancelExchange(
    exchangeId: String!
    userId: String!
    reason: String!
  ): CancelResponse!

  submitRating(
    exchangeId: String!
    userId: String!
    thumbsUp: Boolean!
  ): RatingResponse!
}

type Subscription {
  onSpotsUpdate: ParkingSignalResponse
    @aws_subscribe(mutations: ["createParkingSignal"])
}

type Query {
  getSignal(signalId: String!): ParkingSignal
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}