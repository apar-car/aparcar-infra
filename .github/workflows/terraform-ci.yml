name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.hcl'
      - '.github/workflows/terraform-ci.yml'
      - '**.graphql'
      - 'src/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: '1.9.0'
  AWS_REGION: 'eu-west-1'
  WORKING_DIR: 'environments/dev'

jobs:
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@f79bc868ee9ca4687c7db10f05fe6a46cdcda892 # v6
        with:
          role-to-assume: arn:aws:iam::945475931696:role/GitHubActions-TerraformCI
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure Git for GitHub
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Audit Lambda dependencies
        run: |
          pip install pip-audit --break-system-packages
          for req in src/*/requirements.txt; do
            if [ -s "$req" ]; then
              echo "Auditing $req"
              pip-audit -r "$req" || true
            fi
          done

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Init
        id: init
        run: terraform init -backend-config=backend.hcl
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        id: validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12
        with:
          directory: .
          framework: terraform
          soft_fail: false
          output_format: cli
          skip_check: CKV_AWS_144,CKV_AWS_18,CKV_AWS_119,CKV2_AWS_62,CKV2_AWS_61,CKV_AWS_145,CKV_AWS_158,CKV_AWS_355,CKV_AWS_50,CKV_AWS_272,CKV2_AWS_73,CKV_AWS_173,CKV_AWS_288,CKV_AWS_287,CKV_AWS_290,CKV2_AWS_33,CKV2_AWS_40,CKV_AWS_134,CKV_AWS_31,CKV_AWS_191,CKV2_AWS_50
          download_external_modules: true

      - name: Run Trivy
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          scan-type: config
          scan-ref: .
          exit-code: 1
          severity: HIGH,CRITICAL
        env:
          TRIVY_IGNOREFILE: .trivyignore

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ${{ env.WORKING_DIR }}

      - name: Post Plan to PR
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        if: always()
        with:
          script: |
            const output = `#### Terraform CI Results
            | Step | Status |
            |------|--------|
            | Format | ${{ steps.fmt.outcome == 'success' && '✅' || '❌' }} |
            | Init | ${{ steps.init.outcome == 'success' && '✅' || '❌' }} |
            | Validate | ${{ steps.validate.outcome == 'success' && '✅' || '❌' }} |
            | Plan | ${{ steps.plan.outcome == 'success' && '✅' || '❌' }} |
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })